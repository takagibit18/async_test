[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-async-learning"
version = "0.1.0"
description = "Async OpenAI learning project with retries, validation and tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.66.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "tenacity>=9.0.0",
  "tiktoken>=0.9.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=llm_async_learning --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests requiring real OpenAI API"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
